syntax = "proto3";

import "google/protobuf/struct.proto";
option go_package = "github.com/d4l-data4life/grpc-modules/pkg/research-pillars";

package proto;

/////////////////////////////////////////////////////////
// Type Definitions
/////////////////////////////////////////////////////////

message Questionnaire {
  string name = 1;
  string version = 2;
  map<string, string> title = 3;
  repeated Question questions = 4;
}

message Question {
  string linkId = 1;
  InputType inputType = 2;
  bool required = 3;
  map<string, string> text = 4;
  optional Answerset answerset = 5;
  optional google.protobuf.Struct config = 6;
  repeated EnableWhen enable_when = 7;
  optional string enable_behavior = 8;
  repeated string prepopulate = 9; // DEPRECATED — replaced by input/output; kept during the topic migration, see HUB-6797
  repeated Question items = 10;
  optional QuestionImage image = 11;
  repeated TopicInput input = 12; // populate this question's candidate options from topics
  repeated string output = 13; // topic ids this question's answer(s) publish to
}

// A topic subscription: which topic to read and how far back.
message TopicInput {
  string topic = 1;
  TopicScope scope = 2;
}

enum TopicScope {
  session = 0; // current fill session only
  latest = 1; // + the latest persisted response
  all = 2; // + all persisted responses
}

enum InputType {
  // Default Types
  display = 0;
  string = 1;
  text = 2;
  integer = 3;
  decimal = 4;
  date = 5;
  // Mapped Types
  single_select = 6; // coding
  multi_select = 7; // coding
  year = 8; // date
  scale_numeric = 9; // decimal
  scale_ordinal = 10; // integer
  geo_location = 11; // string
  list = 12; // string
  group = 13;
  matrix = 14; // group
  matrix_item = 15; // coding
  country = 16; // coding, answerValueSet = http://hl7.org/fhir/ValueSet/iso3166-1-2
  postal_code = 17; // string, live-validated via @d4l/postalcodes; country source carried in postalcode-country-source FHIR extension
  scale_likert = 18; // integer, like scale_ordinal, but with label for each individual value using a valueset
}

message Answerset {
  string order = 1;
  repeated Answer answers = 2;
  optional string system = 3;
}

message Answer {
  string code = 1;
  map<string, string> languages = 2;
}

message EnableWhen {
  string question = 1;
  Operator operator = 2;
  optional string answer_coding = 3;
  optional double answer_decimal = 4;
  optional string answer_date = 5;
}

message QuestionImage {
  string data = 1;
  string contentType = 2;
  string src = 3;
  string alt = 4;
}

enum Operator {
  exists = 0;
  eq = 1;
  neq = 2;
  gt = 3;
  lt = 4;
  gteq = 5;
  lteq = 6;
}

message Diff {
  google.protobuf.Struct change = 1;
  string timestamp = 2;
  User user = 3;
}

message User {
  string email = 1;
  string name = 2;
  bool isAdmin = 3;
  repeated ProgramRole programRoles = 4;
}

message ProgramRole {
  string userEmail = 1;
  string programName = 2;
  Role role = 3;
}

enum Role {
  viewer = 0;
  editor = 1;
  manager = 2;
}

message BlockedProgram {
  string userEmail = 1;
  string programName = 2;
  string timestamp = 3;
}

enum CodeStatus {
  unused = 0;
  used = 1;
}

message ParticipantCode {
  string code = 1;
  CodeStatus status = 2;
}

message Client {
  string name = 1;
  string programName = 2;
  string clientID = 3;
  string clientSecret = 4;
}

message DeviceToken {
  string programName = 1;
  string subjectID = 2;
  string token = 3;
  optional string participantCode = 4;
}

message AccessToken {
  string programName = 1;
  string name = 2;
  string createdAt = 3;
  string lastUsedAt = 4;
}
